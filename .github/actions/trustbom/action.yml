# trustbom-generated: version=1.0.0-dev.465 sha256=86b22b916314570b7a7c89e30197999a94f28a4362ac807aa96baece45f3afd9
# Generated by `trustbom init`. Contract matches the AI TrustBOM Action.
name: AI TrustBOM
description: Scan a repository, evaluate its git-native approval, and publish pull-request results.
author: Spaverlock

branding:
  icon: shield
  color: blue

inputs:
  fail-on:
    description: Minimum unwaived finding severity that blocks the gate.
    default: medium
    required: false
  path:
    description: Optional repository-relative glob limiting the tracked-file inventory.
    default: ""
    required: false
  baseline:
    description: Repository-relative approval file path.
    default: trust/approvals.yml
    required: false
  comment:
    description: Create or update the AI TrustBOM pull-request comment.
    default: "true"
    required: false
  portfolio:
    description: Scan and gate the systems declared in trust/portfolio.yml.
    default: "false"
    required: false

outputs:
  graph-sha:
    description: SHA-256 approval hash of the generated system graph.
    value: ${{ steps.trustbom.outputs.graph-sha }}
  sarif:
    description: Repository-relative path to the generated SARIF file.
    value: ${{ steps.trustbom.outputs.sarif }}
  gate-status:
    description: "Gate status: passed, breakglass, failed, or bootstraprequired."
    value: ${{ steps.trustbom.outputs.gate-status }}
  system-ids:
    description: JSON array of portfolio system IDs (portfolio mode only).
    value: ${{ steps.trustbom.outputs.system-ids }}
  graph-shas:
    description: JSON object mapping portfolio system IDs to graph fingerprints.
    value: ${{ steps.trustbom.outputs.graph-shas }}
  sarif-paths:
    description: JSON object mapping portfolio system IDs to SARIF paths.
    value: ${{ steps.trustbom.outputs.sarif-paths }}

# Composite action: runs the exact pinned trustbom package (see ./install). It needs Node, npm
# and Git, not a container runtime or the .NET SDK. Changes are gated by CODEOWNERS.
runs:
  using: composite
  steps:
    - name: Install AI TrustBOM
      id: install
      uses: ./.github/actions/trustbom/install

    - name: Run AI TrustBOM
      id: trustbom
      shell: bash
      env:
        TRUSTBOM_LAUNCHER: ${{ steps.install.outputs.launcher }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_PORTFOLIO: ${{ inputs.portfolio }}
      run: |
        set -euo pipefail
        args=(action --fail-on "$INPUT_FAIL_ON" --path "$INPUT_PATH" --baseline "$INPUT_BASELINE" "--comment=$INPUT_COMMENT" "--portfolio=$INPUT_PORTFOLIO")
        node "$TRUSTBOM_LAUNCHER" "${args[@]}"
