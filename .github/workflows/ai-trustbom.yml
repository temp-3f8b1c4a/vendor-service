# trustbom-generated: version=1.0.0-dev.493 sha256=cbc2b363eccf71b03b23a7d1353ce7c407ac1480a819815d8e15d4bf323437cd
name: AI TrustBOM

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Scan and gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan and gate
        uses: ./.github/actions/trustbom
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          fail-on: medium
          baseline: trust/approvals.yml
          comment: true
