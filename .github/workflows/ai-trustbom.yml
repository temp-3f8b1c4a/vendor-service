# trustbom-generated: version=1.0.0-dev.465 sha256=e95b21417513cbd68c64a4ecc5c620a47d3d47581b053e33e1be531645d9ba5c
name: AI TrustBOM

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  review:
    name: Scan and gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Prepare unsigned approval bootstrap
        shell: bash
        run: |
          if grep --fixed-strings --line-regexp --quiet \
              '# AI TrustBOM unsigned approval template' \
              trust/approvals.yml \
            && ! grep --extended-regexp --quiet \
              '^[[:space:]]*[^#[:space:]]' \
              trust/approvals.yml; then
            rm trust/approvals.yml
          fi

      - name: Scan and gate
        uses: ./.github/actions/trustbom
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          fail-on: medium
          baseline: trust/approvals.yml
          comment: true

  stamp:
    name: Validate and stamp approval
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install AI TrustBOM
        id: install
        uses: ./.github/actions/trustbom/install

      - name: Prepare unsigned approval bootstrap
        shell: bash
        run: |
          if grep --fixed-strings --line-regexp --quiet \
              '# AI TrustBOM unsigned approval template' \
              trust/approvals.yml \
            && ! grep --extended-regexp --quiet \
              '^[[:space:]]*[^#[:space:]]' \
              trust/approvals.yml; then
            rm trust/approvals.yml
          fi

      - name: Validate pushed graph and approval
        shell: bash
        env:
          TRUSTBOM_LAUNCHER: ${{ steps.install.outputs.launcher }}
        run: |
          node "$TRUSTBOM_LAUNCHER" action \
            --baseline trust/approvals.yml \
            --comment=false \
            --fail-on medium

      - name: Stamp approved commit
        shell: bash
        env:
          TRUSTBOM_LAUNCHER: ${{ steps.install.outputs.launcher }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSHED_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node "$TRUSTBOM_LAUNCHER" stamp \
            --baseline trust/approvals.yml \
            --branch "$DEFAULT_BRANCH" \
            --commit "$PUSHED_COMMIT" \
            --fail-on medium
