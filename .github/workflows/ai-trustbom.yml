# trustbom-generated: version=1.0.0-dev.466 sha256=8d8d1a9e2523f6efe73b6f83ce52e2e5c52defc88ed502d9f1925714d0dda5a6
name: AI TrustBOM

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  review:
    name: Scan and gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan and gate
        uses: ./.github/actions/trustbom
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          fail-on: medium
          baseline: trust/approvals.yml
          comment: true

  stamp:
    name: Validate and stamp approval
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install AI TrustBOM
        id: install
        uses: ./.github/actions/trustbom/install

      - name: Validate pushed graph and approval
        shell: bash
        env:
          TRUSTBOM_LAUNCHER: ${{ steps.install.outputs.launcher }}
        run: |
          node "$TRUSTBOM_LAUNCHER" action \
            --baseline trust/approvals.yml \
            --comment=false \
            --fail-on medium

      - name: Stamp approved commit
        shell: bash
        env:
          TRUSTBOM_LAUNCHER: ${{ steps.install.outputs.launcher }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSHED_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node "$TRUSTBOM_LAUNCHER" stamp \
            --baseline trust/approvals.yml \
            --branch "$DEFAULT_BRANCH" \
            --commit "$PUSHED_COMMIT" \
            --fail-on medium
